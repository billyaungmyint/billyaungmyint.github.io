career-profile:
  title: Career Profile
  summary: |
    Highly Motivated Singapore Permanent Resident with 19+ years of experience in IT with 9+ years in Banking environment,
    Project and Data Management with Oracle DB, Microsoft SQL Server Data warehouse, Windows, Linux, BASH,
    Python Scripting experience with a proven track record of consistent contributions to increase production, quality,
    cost effectiveness and management capability. An Effective Communicator and team builder skilled in cross-functional
    team collaboration with all operating departments. Key player in strategic planning, top achiever with an outstanding
    commitment. A self-starter known as a people person and strong team player who thrives on challenges and developing
    sound business solutions to problems through initiative, knowledge, and ensuring the achievement of specific goals.
    Delivered performance improvement through cost reduction, production, efficiency and company culture of continuous
    improvements.

    Has also authored a book on Oracle Database Management and published on Amazon -
    https://www.amazon.com/dp/B078QPMYH3
