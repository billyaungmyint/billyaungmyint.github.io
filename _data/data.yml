experiences:
  title: Experiences
  info:
    - role: IT Systems Administrator
      time: Dec 2023 - Present
      company: BW Epic Kosan
      details: |
        BW Epic Kosan is the world's leading owner and operator of modern high-quality fully pressurised, semi-refrigerated as
        well as ethylene and ammonia capable vessels which provide maritime transportation of liquified petroleum gas (LPG),
        petrochemicals and other speciality gases.

        Main Responsibilities:
          - End user support
          - Vessel PMS and Safety related applications
          - Crew Management Systems
          - Accounting and Finance Systems (ShipNet One, Oracle Netsuite, EyeShare, Prophix etc.)
          - Email communication systems (Exchange Online)
          - Commercial and Operations related systems (IMOS, Diabos)
          - Microsoft PowerBI
          - Microsoft AD
          - IT helpdesk systems
          - Microsoft SQL Database management
          - Microsoft Azure
          - Microsoft 365
          - Information Security systems (endpoint security, DNS security, MFA etc.)
          - Standards for Workstations and networks for all BWEK locations
          - Printers and peripherals
          - Communication systems (data networks, landline/cell phones, and satellite communication (ships))
          - Meeting room systems
          - Vendor Management
    - role: Assistant Manager
      time: Feb 2014 - Dec 2023
      company: Sing Investments & Finance Ltd
      details: |
        Sing Investments & Finance Limited is a finance company listed on the Singapore Stock Exchange with more than 40
        years of lending experience in the financing arena.

        Projects:
          - Setup and Documented internal Loan Application Website consisting of Oracle Database and Weblogic
          - Setup and Documented internal Document Management system based on JBOSS
          - Setup Core Banking System consisting of Oracle Database and Weblogic
          - Developed a Python program to extract location from IP address
          - Developed Windows and Shell scripts to transfer files across the servers using Task Scheduler and Cron
          - Applied latest patches on Windows/Linux systems using internal repository
          - Web automation using selenium webdriver using Python

        Main Responsibilities:
          - General Server Administration (Backup/Restore/Configuration/Security/Vulnerability Analysis)
          - Oracle 11gR2 / 12cR1 Installation and Administration
          - MS SQL Server Data warehouse Administration
          - Active Directory (Users and Security Administration)
          - VMWare vSphere Server Administration
          - Oracle WebLogic Server Installation and Administration
          - Apache Tomcat Administration
          - JBOSS server Administration
          - Apache web server Installation, Setup and Administration
          - IIS Administration
          - Automation of tasks using Windows command line / Bash shell scripting
          - Assist in ongoing Project Management
          - SQL Data warehouse Development (ETL Operations)
          - Infosys's Finacle Setup/Administration and EOD Processing
    - role: Solutions Consultant
      time: Oct 2012 - Feb 2014
      company: Alpsoft Technologies Pte Ltd
      details: |
        Alpsoft Technologies is a local System Integrator (SI) and software reseller company since 2002 and has served many
        SMEs and MNCs in Singapore.

        Responsibilities:
          - Administration and Maintenance of company IT Infrastructure
          - MailEnable Email Server, Sharepoint Server, Web Applications Server, DNS Server
          - Fortigate Firewall, APC UPS, Cisco/Intel Switches, Cisco Router
          - Linux and Solaris Servers
          - Cloud server hosted at Singtel Alatum Datacenter
          - Providing consultation services to existing customers of Atempo Backup software
          - Training (for both End Users and Administrators)
          - Configuration and Maintenance of Software
          - Pre and Post Sales documentations and trainings
          - Providing ad-hoc consultation services for VMWare, Active Directory, Webhosting Solutions

