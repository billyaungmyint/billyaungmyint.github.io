experiences:
  title: Experiences
  info:
    - role: IT Systems Administrator
      time: Dec 2023 - Present
      company: BW Epic Kosan
      details: |
        Global owner/operator of LPG, petrochemical & ammonia-capable gas carriers.

          - Built and containerised an internal audit application (Python, FastAPI, Docker).
          - Administer Microsoft Azure, M365, Exchange Online, Active Directory and SQL Server for all BWEK offices and vessels.
          - Support business-critical platforms: ShipNet One, Oracle NetSuite, EyeShare, Prophix, IMOS, Diabos, Power BI, vessel PMS and crew systems.
          - Run information-security standards (endpoint, DNS security, MFA) across workstations and networks.
          - Manage communications (data networks, telephony, ship satellite links), meeting-room systems, helpdesk and vendors.
    - role: Assistant Manager, IT
      time: Feb 2014 - Dec 2023
      company: Sing Investments & Finance Ltd
      details: |
        SGX-listed finance company with 40+ years of lending experience.

          - Led setup of Infosys Finacle core banking (Solaris, WebLogic, Oracle 12c), replacing AS400/FIMIS; owned EOD processing and user audit.
          - Built and documented loan-application site (Oracle/WebLogic) and JBoss document-management system.
          - Administered Oracle (RMAN backup/restore, security), SQL Server data warehouse & ETL, SAP BusinessObjects universe.
          - Managed VMware, AD, IIS, Apache, Tomcat; patching and vulnerability analysis on Windows/Linux.
          - Automated file transfers, reports and web tasks with Python, Selenium, Bash, Cron and Task Scheduler.
          - Drove UAT, test cases, SVN-based change management and end-user training.
    - role: Solutions Consultant
      time: Oct 2012 - Feb 2014
      company: Alpsoft Technologies Pte Ltd
      details: |
        Systems integrator & software reseller.

          - Consulted and trained clients on Atempo backup, VMware and Active Directory; pre/post-sales documentation.
          - Ran company infrastructure: firewall, switches/routers, mail, SharePoint, Linux/Solaris and cloud servers.
          - Planned and executed office and data-centre server relocations with Singtel.
    - role: MIS Officer
      time: Apr 2011 - Oct 2012
      company: Amtek Precision Engineering Pte Ltd
      details: |
        Supported hardware, Windows, MS Office, SAP client and AutoCAD for the Singapore office.

